<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Камера MacBook</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #eee;
        font:
          16px -apple-system,
          system-ui,
          sans-serif;
      }
      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      canvas {
        display: none;
      }
      #bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
        display: flex;
        gap: 12px;
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border-radius: 8px;
        border: 0;
        background: #2f7df6;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <video id="v" autoplay muted playsinline webkit-playsinline></video>
    <canvas id="c"></canvas>
    <div id="bar">
      <span id="status">Подключение…</span
      ><button id="sound" hidden>Включить звук</button>
    </div>
    <script src="common.js"></script>
    <script>
      var $ = function (id) {
        return document.getElementById(id);
      };
      var v = $("v"),
        canvas = $("c"),
        ctx = canvas.getContext("2d");
      var pc = null,
        ws,
        queue = [],
        remote = false,
        fallbackTimer = null,
        inFallback = false,
        live = false;

      function setStatus(t) {
        $("status").textContent = t;
      }

      function connect() {
        ws = new WebSocket(wsUrl());
        ws.binaryType = "blob";
        ws.onopen = function () {
          inFallback = false;
          canvas.style.display = "none";
          ws.send(JSON.stringify({ type: "viewer" }));
        };
        ws.onclose = function () {
          setStatus("Нет связи, переподключение…");
          setTimeout(connect, 1500);
        };
        ws.onmessage = function (ev) {
          if (typeof ev.data !== "string") return drawFrame(ev.data);
          var m = JSON.parse(ev.data);
          if (m.type === "waiting")
            reset(
              "Ждём вещание с MacBook… (на Mac откройте страницу вещания и нажмите «Включить камеру»)",
            );
          else if (m.type === "live") {
            live = true;
            setStatus("Подключаемся к камере…");
            armFallback();
          } else if (m.type === "offer") onOffer(m.sdp);
          else if (m.type === "candidate") onCandidate(m.candidate);
        };
      }

      function reset(text) {
        live = false;
        if (pc) {
          pc.close();
          pc = null;
        }
        clearTimeout(fallbackTimer);
        setFallback(false);
        v.srcObject = null;
        $("sound").hidden = true;
        setStatus(text);
      }

      function onOffer(sdp) {
        if (pc) pc.close();
        queue = [];
        remote = false;
        pc = new RTCPeerConnection(RTC_CONFIG);
        var mine = pc;
        pc.onicecandidate = function (e) {
          if (e.candidate)
            ws.send(
              JSON.stringify({
                type: "viewer-candidate",
                candidate: e.candidate,
              }),
            );
        };
        pc.ontrack = function (e) {
          var s = e.streams && e.streams[0];
          if (!s) {
            s = v.srcObject || new MediaStream();
            s.addTrack(e.track);
          }
          v.srcObject = s;
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
          $("sound").hidden = !s.getAudioTracks().length;
        };
        pc.onconnectionstatechange = function () {
          if (mine !== pc) return;
          if (pc.connectionState === "connected") {
            clearTimeout(fallbackTimer);
            setFallback(false);
            setStatus("● В эфире");
          }
        };
        pc.setRemoteDescription(sdp)
          .then(function () {
            remote = true;
            queue.forEach(function (c) {
              mine.addIceCandidate(c).catch(function () {});
            });
            queue = [];
            return mine.createAnswer();
          })
          .then(function (a) {
            return mine.setLocalDescription(a);
          })
          .then(function () {
            ws.send(
              JSON.stringify({ type: "answer", sdp: mine.localDescription }),
            );
          })
          .catch(function () {});
      }
      function onCandidate(c) {
        if (!c) return;
        if (pc && remote) pc.addIceCandidate(c).catch(function () {});
        else queue.push(c);
      }

      // Если WebRTC не соединился за 8 с (мобильные браузеры без mDNS и т.п.) — картинка кадрами JPEG.
      function armFallback() {
        clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(function () {
          if (live && !(pc && pc.connectionState === "connected"))
            setFallback(true);
        }, 8000);
      }
      function setFallback(on) {
        if (inFallback === on) return;
        inFallback = on;
        canvas.style.display = on ? "block" : "none";
        if (ws.readyState === 1)
          ws.send(JSON.stringify({ type: "want-frames", on: on }));
        if (on) setStatus("● В эфире (запасной режим, без звука)");
      }
      function drawFrame(blob) {
        if (!inFallback) return;
        var img = new Image();
        img.onload = function () {
          if (canvas.width !== img.width) {
            canvas.width = img.width;
            canvas.height = img.height;
          }
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(blob);
      }

      $("sound").onclick = function () {
        v.muted = false;
        v.play();
        $("sound").hidden = true;
      };
      connect();
    </script>
  </body>
</html>
