<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Камера" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>Камера MacBook</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #zoomer {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .zbadge {
        min-width: 52px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }
      .toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(96px + env(safe-area-inset-bottom));
        z-index: 3;
        margin: 0 auto;
        max-width: 360px;
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(30, 34, 46, 0.95);
        font-size: 14px;
        text-align: center;
      }
      .toast[hidden] {
        display: none;
      }
      #v,
      #c {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      #c {
        display: none;
      }
      .top,
      .bottom {
        position: fixed;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        transition: opacity 0.25s;
        z-index: 2;
      }
      .top {
        top: 0;
        padding-top: calc(12px + env(safe-area-inset-top));
        background: linear-gradient(rgba(0, 0, 0, 0.65), transparent);
        justify-content: space-between;
      }
      .bottom {
        bottom: 0;
        padding-bottom: calc(14px + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        justify-content: center;
      }
      body.idle .top,
      .bottom {
        flex-wrap: wrap;
      }
      .volrow {
        flex: 1 0 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 420px;
        margin: 0 auto;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .volrow[hidden] {
        display: none;
      }
      .volrow input {
        flex: 1;
        min-width: 0;
        height: 28px;
        accent-color: var(--accent);
      }
      .volrow span {
        min-width: 46px;
        text-align: right;
        font-size: 14px;
        font-weight: 600;
      }
      body.idle .bottom {
        opacity: 0;
        pointer-events: none;
      }
      .round {
        width: 52px;
        height: 52px;
        padding: 0;
        border-radius: 50%;
        font-size: 22px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .round:hover {
        background: rgba(255, 255, 255, 0.26);
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 32px;
        color: var(--muted);
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay .big {
        font-size: 56px;
      }
      .overlay h2 {
        margin: 0;
        color: var(--text);
        font-size: 20px;
      }
      .overlay p {
        margin: 0;
        max-width: 320px;
        font-size: 15px;
      }
      .spin {
        width: 40px;
        height: 40px;
        border: 4px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="zoomer">
        <video id="v" autoplay muted playsinline webkit-playsinline></video>
        <canvas id="c"></canvas>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>

    <div class="overlay" id="overlay">
      <div class="spin" id="spin"></div>
      <div class="big" id="icon" hidden>📡</div>
      <h2 id="title">Подключение…</h2>
      <p id="sub"></p>
    </div>

    <div class="top">
      <span class="pill"
        ><span class="dot" id="dot"></span
        ><span id="status">Подключение…</span></span
      >
    </div>
    <div class="bottom">
      <div class="volrow" id="volrow" hidden>
        <span id="volicon">🔈</span>
        <input
          type="range"
          id="vol"
          min="0"
          max="200"
          step="5"
          value="100"
          aria-label="Громкость"
        />
        <span id="volv">100%</span>
      </div>
      <button class="btn round" id="sound" hidden aria-label="Звук">🔇</button>
      <button class="btn round" id="zout" aria-label="Уменьшить">−</button>
      <span class="zbadge" id="zbadge">×1</span>
      <button class="btn round" id="zin" aria-label="Увеличить">+</button>
      <button class="btn round" id="full" aria-label="На весь экран">⛶</button>
    </div>

    <script src="common.js"></script>
    <script>
      var $ = function (id) {
        return document.getElementById(id);
      };
      var v = $("v"),
        canvas = $("c"),
        ctx = canvas.getContext("2d");
      var pc = null,
        ws,
        queue = [],
        remote = false,
        fallbackTimer = null,
        inFallback = false,
        live = false,
        idleTimer = null;

      /* ---------- интерфейс ---------- */
      function setStatus(text, kind) {
        $("status").textContent = text;
        $("dot").className = "dot" + (kind ? " " + kind : "");
        $("dot").parentNode.className =
          "pill" + (kind === "live" ? " live" : "");
      }
      // state: "connecting" | "waiting" | "playing"
      function show(state, title, sub) {
        $("overlay").hidden = state === "playing";
        $("spin").hidden = state !== "connecting";
        $("icon").hidden = state !== "waiting";
        $("title").textContent = title || "";
        $("sub").textContent = sub || "";
      }
      function wake() {
        document.body.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function () {
          if (!$("overlay").hidden) return;
          document.body.classList.add("idle");
        }, 3500);
      }
      document.addEventListener("touchstart", wake, { passive: true });
      document.addEventListener("mousemove", wake);
      document.addEventListener("click", wake);

      /* ---------- громкость ----------
         iPhone Safari не даёт менять video.volume, поэтому звук идёт через Web Audio
         (GainNode): регулировка 0–200% работает везде. Видео остаётся muted. */
      var AC = window.AudioContext || window.webkitAudioContext;
      var A = {
        ctx: null,
        gain: null,
        src: null,
        stream: null,
        vol: 1,
        on: false,
      };
      function applyVolume() {
        if (A.gain) A.gain.gain.value = A.on ? A.vol : 0;
        else {
          v.muted = !A.on;
          v.volume = Math.min(1, A.vol);
        }
        $("volv").textContent = Math.round(A.vol * 100) + "%";
        var silent = !A.on || A.vol === 0;
        $("sound").textContent = silent ? "🔇" : "🔊";
        $("volicon").textContent = silent ? "🔇" : A.vol < 0.5 ? "🔈" : "🔉";
      }
      function connectAudio() {
        // подключить аудиодорожку текущего потока к GainNode
        if (!A.ctx || !A.stream || !A.stream.getAudioTracks().length) return;
        try {
          if (A.src) A.src.disconnect();
        } catch (e) {}
        A.src = A.ctx.createMediaStreamSource(
          new MediaStream(A.stream.getAudioTracks()),
        );
        A.src.connect(A.gain);
      }
      function enableSound(on) {
        // вызывать из жеста пользователя
        A.on = on;
        if (on && AC && !A.ctx) {
          try {
            A.ctx = new AC();
            A.gain = A.ctx.createGain();
            A.gain.connect(A.ctx.destination);
            v.muted = true; // звук пойдёт через Web Audio
            connectAudio();
          } catch (e) {
            A.ctx = A.gain = null;
          }
        }
        if (on && A.ctx && A.ctx.state === "suspended") A.ctx.resume();
        applyVolume();
        var p = v.play();
        if (p && p.catch) p.catch(function () {});
      }
      $("sound").onclick = function () {
        var on = !(A.on && A.vol > 0);
        if (on && A.vol === 0) {
          A.vol = 1;
          $("vol").value = 100;
        }
        enableSound(on);
      };
      $("vol").oninput = function () {
        A.vol = Number(this.value) / 100;
        enableSound(A.vol > 0);
      };

      var toastTimer = null;
      function toast(text) {
        $("toast").textContent = text;
        $("toast").hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          $("toast").hidden = true;
        }, 6000);
      }
      $("full").onclick = function () {
        var d = document,
          el = d.documentElement;
        if (d.fullscreenElement || d.webkitFullscreenElement) {
          (d.exitFullscreen || d.webkitExitFullscreen).call(d);
          return;
        }
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          var r = req.call(el);
          if (r && r.catch) r.catch(function () {});
          try {
            if (screen.orientation && screen.orientation.lock)
              screen.orientation.lock("landscape").catch(function () {});
          } catch (e) {}
        } else if (window.navigator.standalone) {
          toast("Уже на весь экран");
        } else {
          // iPhone Safari не умеет полноэкранный режим для страниц.
          toast(
            "iPhone: нажмите «Поделиться» → «На экран Домой» и откройте значок — страница запустится без адресной строки.",
          );
        }
      };

      /* ---------- зум: щипок, перетаскивание, двойной тап, колесо, кнопки ---------- */
      var zoomer = $("zoomer"),
        stageEl = $("stage");
      var Z = { s: 1, x: 0, y: 0, max: 8 };
      function applyZoom() {
        var W = stageEl.clientWidth,
          H = stageEl.clientHeight;
        Z.s = Math.min(Z.max, Math.max(1, Z.s));
        Z.x = Math.min(0, Math.max(W * (1 - Z.s), Z.x));
        Z.y = Math.min(0, Math.max(H * (1 - Z.s), Z.y));
        zoomer.style.transform =
          "translate(" + Z.x + "px," + Z.y + "px) scale(" + Z.s + ")";
        $("zbadge").textContent = "×" + Math.round(Z.s * 10) / 10;
      }
      function zoomAt(px, py, factor) {
        // зум вокруг точки экрана
        var s2 = Math.min(Z.max, Math.max(1, Z.s * factor)),
          k = s2 / Z.s;
        Z.x = px - (px - Z.x) * k;
        Z.y = py - (py - Z.y) * k;
        Z.s = s2;
        applyZoom();
      }
      var ptrs = {},
        lastTap = 0,
        tapMoved = false,
        startAt = 0;
      function ptrList() {
        return Object.keys(ptrs).map(function (k) {
          return ptrs[k];
        });
      }
      function dist(a, b) {
        return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
      }
      stageEl.addEventListener("pointerdown", function (e) {
        ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
        try {
          stageEl.setPointerCapture(e.pointerId);
        } catch (err) {}
        if (ptrList().length === 1) {
          tapMoved = false;
          startAt = Date.now();
        } else tapMoved = true;
      });
      stageEl.addEventListener("pointermove", function (e) {
        var p = ptrs[e.pointerId];
        if (!p) return;
        var list = ptrList(),
          nx = e.clientX,
          ny = e.clientY;
        if (list.length >= 2) {
          var a = list[0],
            b = list[1],
            before = dist(a, b),
            mx = (a.x + b.x) / 2,
            my = (a.y + b.y) / 2;
          p.x = nx;
          p.y = ny;
          var after = dist(a, b),
            nmx = (a.x + b.x) / 2,
            nmy = (a.y + b.y) / 2;
          if (before > 0) zoomAt(nmx, nmy, after / before);
          Z.x += nmx - mx;
          Z.y += nmy - my;
          applyZoom();
        } else {
          if (Math.abs(nx - p.x) + Math.abs(ny - p.y) > 2) tapMoved = true;
          if (Z.s > 1) {
            Z.x += nx - p.x;
            Z.y += ny - p.y;
            applyZoom();
          }
          p.x = nx;
          p.y = ny;
        }
      });
      function endPtr(e) {
        if (!ptrs[e.pointerId]) return;
        delete ptrs[e.pointerId];
        if (
          e.type === "pointerup" &&
          !tapMoved &&
          Date.now() - startAt < 300 &&
          !ptrList().length
        ) {
          var now = Date.now();
          if (now - lastTap < 320) {
            // двойной тап: ×1 ↔ ×2.5
            if (Z.s > 1.05) {
              Z.x = 0;
              Z.y = 0;
              Z.s = 1;
              applyZoom();
            } else zoomAt(e.clientX, e.clientY, 2.5);
            lastTap = 0;
          } else lastTap = now;
        }
      }
      stageEl.addEventListener("pointerup", endPtr);
      stageEl.addEventListener("pointercancel", endPtr);
      stageEl.addEventListener(
        "wheel",
        function (e) {
          e.preventDefault();
          zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
        },
        { passive: false },
      );
      $("zin").onclick = function () {
        zoomAt(stageEl.clientWidth / 2, stageEl.clientHeight / 2, 1.4);
      };
      $("zout").onclick = function () {
        zoomAt(stageEl.clientWidth / 2, stageEl.clientHeight / 2, 1 / 1.4);
      };
      window.addEventListener("resize", applyZoom);
      // iOS: не даём странице масштабироваться своим щипком.
      ["gesturestart", "gesturechange"].forEach(function (n) {
        document.addEventListener(n, function (e) {
          e.preventDefault();
        });
      });

      // Не даём экрану телефона гаснуть во время просмотра.
      function keepAwake() {
        if (navigator.wakeLock && navigator.wakeLock.request)
          navigator.wakeLock.request("screen").catch(function () {});
      }
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) keepAwake();
      });
      keepAwake();

      /* ---------- сигналинг и WebRTC ---------- */
      function connect() {
        ws = new WebSocket(wsUrl());
        ws.binaryType = "blob";
        ws.onopen = function () {
          inFallback = false;
          canvas.style.display = "none";
          ws.send(JSON.stringify({ type: "viewer" }));
        };
        ws.onclose = function () {
          reset();
          setStatus("Нет связи", "err");
          show(
            "connecting",
            "Переподключение…",
            "Теряется связь с сервером на Mac",
          );
          setTimeout(connect, 1500);
        };
        ws.onmessage = function (ev) {
          if (typeof ev.data !== "string") return drawFrame(ev.data);
          var m = JSON.parse(ev.data);
          if (m.type === "waiting") {
            reset();
            setStatus("Ждём вещание", "wait");
            show(
              "waiting",
              "Ждём вещание с MacBook",
              "На Mac откройте страницу вещания и нажмите «Включить камеру»",
            );
          } else if (m.type === "live") {
            live = true;
            setStatus("Подключаемся…", "wait");
            show("connecting", "Подключаемся к камере…");
            armFallback();
          } else if (m.type === "offer") onOffer(m.sdp);
          else if (m.type === "candidate") onCandidate(m.candidate);
        };
      }

      function reset() {
        live = false;
        if (pc) {
          pc.close();
          pc = null;
        }
        clearTimeout(fallbackTimer);
        setFallback(false);
        v.srcObject = null;
        $("sound").hidden = true;
        $("volrow").hidden = true;
        A.stream = null;
        document.body.classList.remove("idle");
      }

      function playing(text) {
        setStatus(text, "live");
        show("playing");
        wake();
      }

      function onOffer(sdp) {
        if (pc) pc.close();
        queue = [];
        remote = false;
        var mine = (pc = new RTCPeerConnection(RTC_CONFIG));
        mine.onicecandidate = function (e) {
          if (e.candidate)
            ws.send(
              JSON.stringify({
                type: "viewer-candidate",
                candidate: e.candidate,
              }),
            );
        };
        mine.ontrack = function (e) {
          var s = e.streams && e.streams[0];
          if (!s) {
            s = v.srcObject || new MediaStream();
            s.addTrack(e.track);
          }
          v.srcObject = s;
          var p = v.play();
          if (p && p.catch) p.catch(function () {});
          var hasAudio = s.getAudioTracks().length > 0;
          $("sound").hidden = !hasAudio;
          $("volrow").hidden = !hasAudio;
          if (hasAudio) {
            A.stream = s;
            connectAudio();
          }
          applyVolume();
        };
        mine.onconnectionstatechange = function () {
          if (mine !== pc) return;
          if (mine.connectionState === "connected") {
            clearTimeout(fallbackTimer);
            setFallback(false);
            playing("В эфире");
          }
        };
        mine
          .setRemoteDescription(sdp)
          .then(function () {
            remote = true;
            queue.forEach(function (c) {
              mine.addIceCandidate(c).catch(function () {});
            });
            queue = [];
            return mine.createAnswer();
          })
          .then(function (a) {
            return mine.setLocalDescription(a);
          })
          .then(function () {
            ws.send(
              JSON.stringify({ type: "answer", sdp: mine.localDescription }),
            );
          })
          .catch(function () {});
      }
      function onCandidate(c) {
        if (!c) return;
        if (pc && remote) pc.addIceCandidate(c).catch(function () {});
        else queue.push(c);
      }

      // Если WebRTC не соединился за 8 с — картинка кадрами JPEG (без звука).
      function armFallback() {
        clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(function () {
          if (live && !(pc && pc.connectionState === "connected"))
            setFallback(true);
        }, 8000);
      }
      function setFallback(on) {
        if (inFallback === on) return;
        inFallback = on;
        canvas.style.display = on ? "block" : "none";
        if (ws && ws.readyState === 1)
          ws.send(JSON.stringify({ type: "want-frames", on: on }));
        if (on) playing("В эфире · без звука");
      }
      function drawFrame(blob) {
        if (!inFallback) return;
        var img = new Image();
        img.onload = function () {
          if (canvas.width !== img.width) {
            canvas.width = img.width;
            canvas.height = img.height;
          }
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(blob);
      }

      show("connecting", "Подключение…");
      connect();
    </script>
  </body>
</html>
