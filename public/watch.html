<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Камера" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <title>Камера MacBook</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #000;
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        background: #000;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #zoomer {
        position: absolute;
        inset: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .zbadge {
        min-width: 52px;
        text-align: center;
        font-size: 14px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
      }
      body.fill #v,
      body.fill #c {
        object-fit: cover;
      }
      #pinform {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      #pinform[hidden] {
        display: none;
      }
      #pin {
        font: inherit;
        font-size: 22px;
        letter-spacing: 0.3em;
        text-align: center;
        width: 160px;
        padding: 10px;
        color: var(--text);
        background: #0f131b;
        border: 1px solid var(--line);
        border-radius: 12px;
      }
      .talkrow {
        flex: 1 0 100%;
        display: flex;
        justify-content: center;
        gap: 10px;
      }
      .talkrow[hidden] {
        display: none;
      }
      .talkrow .btn {
        width: 52px;
        height: 52px;
        padding: 0;
        border-radius: 50%;
        font-size: 22px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .talkrow .btn[hidden] {
        display: none;
      }
      .talkrow .btn.active {
        background: var(--ok);
        color: #052e13;
      }
      .talkrow .btn.recording {
        width: auto;
        padding: 0 16px;
        border-radius: 26px;
        font-size: 16px;
        background: var(--bad);
        color: #fff;
      }
      @media (max-width: 430px) {
        .bottom {
          gap: 8px;
        }
        .bottom > .round {
          width: 46px;
          height: 46px;
          font-size: 20px;
        }
        .zbadge {
          min-width: 44px;
          padding: 6px 6px;
        }
      }
      .flash {
        position: fixed;
        inset: 0;
        z-index: 4;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      .flash.go {
        animation: flash 0.35s ease-out;
      }
      @keyframes flash {
        from {
          opacity: 0.85;
        }
        to {
          opacity: 0;
        }
      }
      .gear {
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 50%;
        font-size: 20px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .panel {
        position: fixed;
        z-index: 5;
        right: 12px;
        top: calc(64px + env(safe-area-inset-top));
        width: min(320px, calc(100vw - 24px));
        padding: 16px;
        border-radius: 18px;
        background: rgba(21, 25, 34, 0.96);
        border: 1px solid var(--line);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }
      .panel[hidden] {
        display: none;
      }
      .panel h3 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .seg {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
        margin-bottom: 16px;
      }
      .seg button {
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        padding: 9px 2px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #0f131b;
        color: var(--text);
      }
      .seg button.on {
        background: var(--accent);
        border-color: var(--accent);
      }
      .stats {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 4px 12px;
        font-size: 14px;
        margin: 0;
      }
      .stats dt {
        color: var(--muted);
      }
      .stats dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .toast {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: calc(96px + env(safe-area-inset-bottom));
        z-index: 3;
        margin: 0 auto;
        max-width: 360px;
        padding: 12px 16px;
        border-radius: 14px;
        background: rgba(30, 34, 46, 0.95);
        font-size: 14px;
        text-align: center;
      }
      .toast[hidden] {
        display: none;
      }
      #v,
      #c {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      #c {
        display: none;
      }
      .top,
      .bottom {
        position: fixed;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        transition: opacity 0.25s;
        z-index: 2;
      }
      .top {
        top: 0;
        padding-top: calc(12px + env(safe-area-inset-top));
        background: linear-gradient(rgba(0, 0, 0, 0.65), transparent);
        justify-content: space-between;
      }
      .bottom {
        bottom: 0;
        padding-bottom: calc(14px + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        justify-content: center;
      }
      body.idle .top,
      .bottom {
        flex-wrap: wrap;
      }
      .volrow {
        flex: 1 0 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 420px;
        margin: 0 auto;
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .volrow[hidden] {
        display: none;
      }
      .volrow input {
        flex: 1;
        min-width: 0;
        height: 28px;
        accent-color: var(--accent);
      }
      .volrow span {
        min-width: 46px;
        text-align: right;
        font-size: 14px;
        font-weight: 600;
      }
      body.idle .bottom {
        opacity: 0;
        pointer-events: none;
      }
      .round {
        width: 52px;
        height: 52px;
        padding: 0;
        border-radius: 50%;
        font-size: 22px;
        background: rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
      }
      .round:hover {
        background: rgba(255, 255, 255, 0.26);
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 32px;
        color: var(--muted);
      }
      .overlay[hidden] {
        display: none;
      }
      .overlay .big {
        font-size: 56px;
      }
      .overlay h2 {
        margin: 0;
        color: var(--text);
        font-size: 20px;
      }
      .overlay p {
        margin: 0;
        max-width: 320px;
        font-size: 15px;
      }
      .spin {
        width: 40px;
        height: 40px;
        border: 4px solid var(--line);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="zoomer">
        <video id="v" autoplay muted playsinline webkit-playsinline></video>
        <canvas id="c"></canvas>
      </div>
    </div>
    <div class="toast" id="toast" hidden></div>

    <div class="overlay" id="overlay">
      <div class="spin" id="spin"></div>
      <div class="big" id="icon" hidden>📡</div>
      <h2 id="title">Подключение…</h2>
      <p id="sub"></p>
      <form id="pinform" hidden>
        <input
          id="pin"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          autocomplete="off"
          maxlength="8"
          placeholder="PIN"
        />
        <button class="btn" type="submit">Войти</button>
      </form>
    </div>

    <div class="top">
      <span class="pill"
        ><span class="dot" id="dot"></span
        ><span id="status">Подключение…</span></span
      >
      <button class="btn gear" id="gear" aria-label="Качество и статистика">
        ⚙
      </button>
    </div>
    <div class="panel" id="panel" hidden>
      <h3>Качество видео</h3>
      <div class="seg" id="seg">
        <button data-q="auto">Авто</button>
        <button data-q="high">Высокое</button>
        <button data-q="mid">Среднее</button>
        <button data-q="low">Экономное</button>
      </div>
      <h3>Статистика</h3>
      <dl class="stats">
        <dt>Разрешение</dt>
        <dd id="stRes">—</dd>
        <dt>Кадров/с</dt>
        <dd id="stFps">—</dd>
        <dt>Скорость</dt>
        <dd id="stBr">—</dd>
        <dt>Пинг</dt>
        <dd id="stRtt">—</dd>
        <dt>Буфер</dt>
        <dd id="stBuf">—</dd>
        <dt>Режим</dt>
        <dd id="stMode">—</dd>
      </dl>
    </div>
    <div class="flash" id="flash"></div>
    <div class="bottom">
      <div class="talkrow" id="talkrow" hidden>
        <button
          class="btn"
          id="shot"
          aria-label="Сделать снимок"
          title="Снимок"
        >
          📸
        </button>
        <button class="btn" id="rec" aria-label="Записать видео" title="Запись">
          ⏺
        </button>
        <button
          class="btn"
          id="talk"
          aria-label="Говорить в микрофон телефона"
          title="Говорить"
        >
          🎙
        </button>
        <button
          class="btn"
          id="mycam"
          aria-label="Показать камеру телефона"
          title="Моя камера"
        >
          📹
        </button>
      </div>
      <div class="volrow" id="volrow" hidden>
        <span id="volicon">🔈</span>
        <input
          type="range"
          id="vol"
          min="0"
          max="100"
          step="5"
          value="100"
          aria-label="Громкость"
        />
        <span id="volv">100%</span>
      </div>
      <button class="btn round" id="sound" hidden aria-label="Звук">🔇</button>
      <button class="btn round" id="zout" aria-label="Уменьшить">−</button>
      <span class="zbadge" id="zbadge">×1</span>
      <button class="btn round" id="zin" aria-label="Увеличить">+</button>
      <button class="btn round" id="fit" aria-label="Заполнить экран">⤢</button>
      <button class="btn round" id="full" aria-label="На весь экран">⛶</button>
    </div>

    <script src="common.js"></script>
    <script>
      var $ = function (id) {
        return document.getElementById(id);
      };
      var v = $("v"),
        canvas = $("c"),
        ctx = canvas.getContext("2d");
      var pc = null,
        ws,
        queue = [],
        remote = false,
        fallbackTimer = null,
        inFallback = false,
        live = false,
        idleTimer = null;

      /* ---------- интерфейс ---------- */
      function setStatus(text, kind) {
        $("status").textContent = text;
        $("dot").className = "dot" + (kind ? " " + kind : "");
        $("dot").parentNode.className =
          "pill" + (kind === "live" ? " live" : "");
      }
      // state: "connecting" | "waiting" | "playing"
      function show(state, title, sub) {
        $("overlay").hidden = state === "playing";
        $("spin").hidden = state !== "connecting";
        $("icon").hidden = state !== "waiting" && state !== "auth";
        $("icon").textContent = state === "auth" ? "🔒" : "📡";
        $("pinform").hidden = state !== "auth";
        $("title").textContent = title || "";
        $("sub").textContent = sub || "";
      }
      function wake() {
        document.body.classList.remove("idle");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(function () {
          if (!$("overlay").hidden) return;
          document.body.classList.add("idle");
        }, 3500);
      }
      document.addEventListener("touchstart", wake, { passive: true });
      document.addEventListener("mousemove", wake);
      document.addEventListener("click", wake);

      /* ---------- громкость ----------
         Звук играет самим элементом <video> — самый надёжный путь на iPhone и Android.
         iOS не даёт менять video.volume: там громкость — кнопками телефона, ползунок
         скрывается, остаётся кнопка «звук вкл/выкл». */
      var A = { vol: 1, on: false, canVol: false };
      try {
        v.volume = 0.5;
        A.canVol = Math.abs(v.volume - 0.5) < 0.01;
        v.volume = 1;
      } catch (e) {}
      function applyVolume() {
        v.muted = !A.on || (A.canVol && A.vol === 0);
        if (A.canVol) v.volume = Math.min(1, A.vol);
        $("volv").textContent = Math.round(A.vol * 100) + "%";
        $("sound").textContent = v.muted ? "🔇" : "🔊";
        $("volicon").textContent = v.muted ? "🔇" : A.vol < 0.5 ? "🔈" : "🔉";
      }
      function playVideo() {
        var p = v.play();
        if (p && p.catch)
          p.catch(function () {
            // браузер не разрешил воспроизведение со звуком без нажатия — играем без звука
            if (!v.muted) {
              A.on = false;
              applyVolume();
              var p2 = v.play();
              if (p2 && p2.catch) p2.catch(function () {});
              toast("Нажмите 🔊, чтобы включить звук");
            }
          });
      }
      function hasAudio() {
        return !!(v.srcObject && v.srcObject.getAudioTracks().length);
      }
      $("sound").onclick = function () {
        if (!hasAudio()) {
          toast(
            "С Mac не приходит звук. На странице вещания включите «со звуком» и разрешите микрофон.",
          );
          return;
        }
        var on = !(A.on && !v.muted);
        if (on && A.canVol && A.vol === 0) {
          A.vol = 1;
          $("vol").value = 100;
        }
        A.on = on;
        applyVolume();
        playVideo();
      };
      $("vol").oninput = function () {
        A.vol = Number(this.value) / 100;
        A.on = A.vol > 0;
        applyVolume();
        playVideo();
      };

      /* ---------- обратный канал: микрофон/камера телефона -> Mac ---------- */
      var back = {
        pc: null,
        stream: null,
        mic: false,
        cam: false,
        remote: false,
        queue: [],
      };
      function refreshBack() {
        $("talk").classList.toggle("active", back.mic);
        $("mycam").classList.toggle("active", back.cam);
      }
      function backStop() {
        if (back.pc) {
          back.pc.close();
          back.pc = null;
        }
        if (back.stream) {
          back.stream.getTracks().forEach(function (t) {
            t.stop();
          });
          back.stream = null;
        }
        back.remote = false;
        back.queue = [];
      }
      // Пересоздаём соединение под текущий набор «микрофон / камера».
      function backUpdate() {
        backStop();
        if (!back.mic && !back.cam) {
          if (ws && ws.readyState === 1)
            ws.send(JSON.stringify({ type: "back-stop" }));
          return Promise.resolve();
        }
        return navigator.mediaDevices
          .getUserMedia({
            audio: back.mic,
            video: back.cam
              ? { facingMode: "user", width: { ideal: 640 } }
              : false,
          })
          .then(function (s) {
            back.stream = s;
            var pc = (back.pc = new RTCPeerConnection(RTC_CONFIG));
            s.getTracks().forEach(function (t) {
              pc.addTrack(t, s);
            });
            pc.onicecandidate = function (e) {
              if (e.candidate && ws.readyState === 1)
                ws.send(
                  JSON.stringify({
                    type: "back-candidate",
                    candidate: e.candidate,
                  }),
                );
            };
            return pc
              .createOffer()
              .then(function (o) {
                return pc.setLocalDescription(o);
              })
              .then(function () {
                ws.send(
                  JSON.stringify({
                    type: "back-offer",
                    sdp: pc.localDescription,
                  }),
                );
              });
          });
      }
      function onBackAnswer(sdp) {
        var pc = back.pc;
        if (!pc) return;
        pc.setRemoteDescription(sdp)
          .then(function () {
            back.remote = true;
            back.queue.forEach(function (c) {
              pc.addIceCandidate(c).catch(function () {});
            });
            back.queue = [];
          })
          .catch(function () {});
      }
      function onBackIce(c) {
        if (!c || !back.pc) return;
        if (back.remote) back.pc.addIceCandidate(c).catch(function () {});
        else back.queue.push(c);
      }
      function toggleBack(kind) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          toast(
            "Браузер не дал доступ к микрофону и камере — откройте страницу по https.",
          );
          return;
        }
        var prev = { mic: back.mic, cam: back.cam };
        back[kind] = !back[kind];
        refreshBack();
        backUpdate().catch(function (e) {
          back.mic = prev.mic;
          back.cam = prev.cam;
          refreshBack();
          toast(
            "Нет доступа к " +
              (kind === "mic" ? "микрофону" : "камере") +
              (e && e.message ? ": " + e.message : ""),
          );
          backUpdate().catch(function () {});
        });
      }
      $("talk").onclick = function () {
        toggleBack("mic");
        toast(back.mic ? "Микрофон телефона включён" : "Микрофон выключен");
      };
      $("mycam").onclick = function () {
        toggleBack("cam");
        toast(back.cam ? "Камера телефона включена" : "Камера выключена");
      };

      /* ---------- снимок и запись (сохраняются на телефон) ---------- */
      function download(blob, name) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 4000);
      }
      // iPhone: «Поделиться» → «Сохранить в Фото»; иначе обычное скачивание файла.
      function saveBlob(blob, name) {
        var file = null;
        try {
          file = new File([blob], name, { type: blob.type });
        } catch (e) {}
        if (
          file &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        ) {
          return navigator.share({ files: [file] }).catch(function (err) {
            if (!err || err.name !== "AbortError") download(blob, name);
          });
        }
        download(blob, name);
        return Promise.resolve();
      }
      function stamp() {
        var d = new Date(),
          p = function (n) {
            return (n < 10 ? "0" : "") + n;
          };
        return (
          d.getFullYear() +
          p(d.getMonth() + 1) +
          p(d.getDate()) +
          "-" +
          p(d.getHours()) +
          p(d.getMinutes()) +
          p(d.getSeconds())
        );
      }
      $("shot").onclick = function () {
        var src = inFallback ? canvas : v;
        var w = inFallback ? canvas.width : v.videoWidth;
        var h = inFallback ? canvas.height : v.videoHeight;
        if (!w || !h) {
          toast("Пока нет картинки");
          return;
        }
        var c = document.createElement("canvas");
        c.width = w;
        c.height = h;
        c.getContext("2d").drawImage(src, 0, 0, w, h);
        $("flash").classList.remove("go");
        void $("flash").offsetWidth;
        $("flash").classList.add("go");
        c.toBlob(
          function (blob) {
            if (!blob) return toast("Не удалось сделать снимок");
            saveBlob(blob, "camera-" + stamp() + ".jpg").then(function () {
              toast("Снимок сохранён");
            });
          },
          "image/jpeg",
          0.92,
        );
      };

      var R = { rec: null, chunks: [], t0: 0, timer: null, mime: "" };
      function pickMime() {
        var list = [
          "video/mp4;codecs=avc1",
          "video/webm;codecs=vp9,opus",
          "video/webm;codecs=vp8,opus",
          "video/webm",
          "video/mp4",
        ];
        for (var i = 0; i < list.length; i++)
          if (
            window.MediaRecorder &&
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(list[i])
          )
            return list[i];
        return "";
      }
      function recLabel() {
        var s = Math.floor((Date.now() - R.t0) / 1000);
        $("rec").textContent =
          "⏹ " + Math.floor(s / 60) + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
      }
      function startRec() {
        if (!window.MediaRecorder)
          return toast("Этот браузер не умеет записывать видео");
        var src = inFallback ? canvas.captureStream(15) : v.srcObject;
        if (!src) return toast("Пока нет видео");
        R.mime = pickMime();
        var rec;
        try {
          rec = new MediaRecorder(
            src,
            R.mime ? { mimeType: R.mime } : undefined,
          );
        } catch (e) {
          return toast("Не удалось начать запись: " + e.message);
        }
        R.rec = rec;
        R.chunks = [];
        rec.ondataavailable = function (e) {
          if (e.data && e.data.size) R.chunks.push(e.data);
        };
        rec.onstop = function () {
          clearInterval(R.timer);
          R.rec = null;
          $("rec").textContent = "⏺";
          $("rec").classList.remove("recording");
          var type = (rec.mimeType || R.mime || "video/webm").split(";")[0];
          var blob = new Blob(R.chunks, { type: type });
          R.chunks = [];
          if (!blob.size) return toast("Запись пустая");
          saveBlob(
            blob,
            "camera-" + stamp() + (type.indexOf("mp4") >= 0 ? ".mp4" : ".webm"),
          ).then(function () {
            toast("Запись сохранена");
          });
        };
        rec.start(1000);
        R.t0 = Date.now();
        $("rec").classList.add("recording");
        recLabel();
        R.timer = setInterval(recLabel, 1000);
      }
      function stopRec() {
        if (R.rec && R.rec.state !== "inactive") R.rec.stop();
      }
      $("rec").onclick = function () {
        if (R.rec) stopRec();
        else startRec();
      };

      /* ---------- качество и статистика ---------- */
      var quality = "auto";
      try {
        quality = localStorage.getItem("quality") || "auto";
      } catch (e) {}
      function markQuality() {
        [].forEach.call($("seg").children, function (b) {
          b.classList.toggle("on", b.getAttribute("data-q") === quality);
        });
      }
      function sendQuality() {
        if (ws && ws.readyState === 1)
          ws.send(JSON.stringify({ type: "quality", level: quality }));
      }
      [].forEach.call($("seg").children, function (b) {
        b.onclick = function () {
          quality = b.getAttribute("data-q");
          try {
            localStorage.setItem("quality", quality);
          } catch (e) {}
          markQuality();
          sendQuality();
        };
      });
      markQuality();

      var prev = null;
      function updateStats() {
        if (!pc || inFallback) {
          $("stRes").textContent = v.videoWidth
            ? v.videoWidth + "×" + v.videoHeight
            : "—";
          $("stMode").textContent = inFallback ? "запасной (кадры)" : "—";
          ["stFps", "stBr", "stRtt", "stBuf"].forEach(function (id) {
            $(id).textContent = "—";
          });
          return;
        }
        pc.getStats()
          .then(function (report) {
            var now = Date.now(),
              inbound = null,
              pair = null,
              remoteType = "";
            report.forEach(function (s) {
              if (
                s.type === "inbound-rtp" &&
                (s.kind === "video" || s.mediaType === "video")
              )
                inbound = s;
              if (
                s.type === "candidate-pair" &&
                (s.nominated || s.state === "succeeded") &&
                s.currentRoundTripTime != null
              )
                pair = s;
            });
            if (pair)
              report.forEach(function (s) {
                if (s.id === pair.remoteCandidateId)
                  remoteType = s.candidateType;
              });
            $("stRes").textContent = v.videoWidth
              ? v.videoWidth + "×" + v.videoHeight
              : "—";
            if (inbound && prev && now > prev.t) {
              var dt = (now - prev.t) / 1000;
              $("stFps").textContent = Math.max(
                0,
                Math.round((inbound.framesDecoded - prev.frames) / dt),
              );
              $("stBr").textContent =
                (
                  (Math.max(0, inbound.bytesReceived - prev.bytes) * 8) /
                  dt /
                  1e6
                ).toFixed(1) + " Мбит/с";
            }
            if (inbound) {
              prev = {
                t: now,
                frames: inbound.framesDecoded,
                bytes: inbound.bytesReceived,
              };
              if (
                inbound.jitterBufferDelay != null &&
                inbound.jitterBufferEmittedCount
              )
                $("stBuf").textContent =
                  Math.round(
                    (inbound.jitterBufferDelay /
                      inbound.jitterBufferEmittedCount) *
                      1000,
                  ) + " мс";
            }
            $("stRtt").textContent = pair
              ? Math.round(pair.currentRoundTripTime * 1000) + " мс"
              : "—";
            $("stMode").textContent = pair
              ? remoteType === "relay"
                ? "через ретранслятор"
                : "напрямую"
              : "—";
          })
          .catch(function () {});
      }
      var statsTimer = null;
      $("gear").onclick = function () {
        var open = $("panel").hidden;
        $("panel").hidden = !open;
        clearInterval(statsTimer);
        prev = null;
        if (open) {
          updateStats();
          statsTimer = setInterval(updateStats, 1000);
        }
      };

      var toastTimer = null;
      function toast(text) {
        $("toast").textContent = text;
        $("toast").hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          $("toast").hidden = true;
        }, 6000);
      }
      $("full").onclick = function () {
        var d = document,
          el = d.documentElement;
        if (d.fullscreenElement || d.webkitFullscreenElement) {
          (d.exitFullscreen || d.webkitExitFullscreen).call(d);
          return;
        }
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          var r = req.call(el);
          if (r && r.catch) r.catch(function () {});
          try {
            if (screen.orientation && screen.orientation.lock)
              screen.orientation.lock("landscape").catch(function () {});
          } catch (e) {}
        } else if (window.navigator.standalone) {
          toast("Уже на весь экран");
        } else {
          // iPhone Safari не умеет полноэкранный режим для страниц.
          toast(
            "iPhone: нажмите «Поделиться» → «На экран Домой» и откройте значок — страница запустится без адресной строки.",
          );
        }
      };

      /* ---------- зум: щипок, перетаскивание, двойной тап, колесо, кнопки ---------- */
      var zoomer = $("zoomer"),
        stageEl = $("stage");
      var Z = { s: 1, x: 0, y: 0, max: 8 };
      function applyZoom() {
        var W = stageEl.clientWidth,
          H = stageEl.clientHeight;
        Z.s = Math.min(Z.max, Math.max(1, Z.s));
        Z.x = Math.min(0, Math.max(W * (1 - Z.s), Z.x));
        Z.y = Math.min(0, Math.max(H * (1 - Z.s), Z.y));
        zoomer.style.transform =
          "translate(" + Z.x + "px," + Z.y + "px) scale(" + Z.s + ")";
        $("zbadge").textContent = "×" + Math.round(Z.s * 10) / 10;
      }
      function zoomAt(px, py, factor) {
        // зум вокруг точки экрана
        var s2 = Math.min(Z.max, Math.max(1, Z.s * factor)),
          k = s2 / Z.s;
        Z.x = px - (px - Z.x) * k;
        Z.y = py - (py - Z.y) * k;
        Z.s = s2;
        applyZoom();
      }
      var ptrs = {},
        lastTap = 0,
        tapMoved = false,
        startAt = 0;
      function ptrList() {
        return Object.keys(ptrs).map(function (k) {
          return ptrs[k];
        });
      }
      function dist(a, b) {
        return Math.sqrt((a.x - b.x) * (a.x - b.x) + (a.y - b.y) * (a.y - b.y));
      }
      stageEl.addEventListener("pointerdown", function (e) {
        ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
        try {
          stageEl.setPointerCapture(e.pointerId);
        } catch (err) {}
        if (ptrList().length === 1) {
          tapMoved = false;
          startAt = Date.now();
        } else tapMoved = true;
      });
      stageEl.addEventListener("pointermove", function (e) {
        var p = ptrs[e.pointerId];
        if (!p) return;
        var list = ptrList(),
          nx = e.clientX,
          ny = e.clientY;
        if (list.length >= 2) {
          var a = list[0],
            b = list[1],
            before = dist(a, b),
            mx = (a.x + b.x) / 2,
            my = (a.y + b.y) / 2;
          p.x = nx;
          p.y = ny;
          var after = dist(a, b),
            nmx = (a.x + b.x) / 2,
            nmy = (a.y + b.y) / 2;
          if (before > 0) zoomAt(nmx, nmy, after / before);
          Z.x += nmx - mx;
          Z.y += nmy - my;
          applyZoom();
        } else {
          if (Math.abs(nx - p.x) + Math.abs(ny - p.y) > 2) tapMoved = true;
          if (Z.s > 1) {
            Z.x += nx - p.x;
            Z.y += ny - p.y;
            applyZoom();
          }
          p.x = nx;
          p.y = ny;
        }
      });
      function endPtr(e) {
        if (!ptrs[e.pointerId]) return;
        delete ptrs[e.pointerId];
        if (
          e.type === "pointerup" &&
          !tapMoved &&
          Date.now() - startAt < 300 &&
          !ptrList().length
        ) {
          var now = Date.now();
          if (now - lastTap < 320) {
            // двойной тап: ×1 ↔ ×2.5
            if (Z.s > 1.05) {
              Z.x = 0;
              Z.y = 0;
              Z.s = 1;
              applyZoom();
            } else zoomAt(e.clientX, e.clientY, 2.5);
            lastTap = 0;
          } else lastTap = now;
        }
      }
      stageEl.addEventListener("pointerup", endPtr);
      stageEl.addEventListener("pointercancel", endPtr);
      stageEl.addEventListener(
        "wheel",
        function (e) {
          e.preventDefault();
          zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15);
        },
        { passive: false },
      );
      $("zin").onclick = function () {
        zoomAt(stageEl.clientWidth / 2, stageEl.clientHeight / 2, 1.4);
      };
      $("zout").onclick = function () {
        zoomAt(stageEl.clientWidth / 2, stageEl.clientHeight / 2, 1 / 1.4);
      };
      window.addEventListener("resize", applyZoom);
      // iOS: не даём странице масштабироваться своим щипком.
      ["gesturestart", "gesturechange"].forEach(function (n) {
        document.addEventListener(n, function (e) {
          e.preventDefault();
        });
      });

      // Не даём экрану телефона гаснуть во время просмотра.
      function keepAwake() {
        if (navigator.wakeLock && navigator.wakeLock.request)
          navigator.wakeLock.request("screen").catch(function () {});
      }
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) keepAwake();
      });
      keepAwake();

      /* ---------- сигналинг и WebRTC ---------- */
      /* ---------- PIN: из ссылки (?pin=…) или из памяти телефона ---------- */
      var pin = "";
      try {
        pin =
          new URLSearchParams(location.search).get("pin") ||
          localStorage.getItem("pin") ||
          "";
        if (pin) localStorage.setItem("pin", pin);
      } catch (e) {}
      $("pinform").onsubmit = function (e) {
        e.preventDefault();
        pin = $("pin").value.trim();
        if (!pin) return;
        try {
          localStorage.setItem("pin", pin);
        } catch (err) {}
        setStatus("Проверяем PIN…", "wait");
        show("connecting", "Проверяем PIN…");
        ws.send(JSON.stringify({ type: "viewer", pin: pin }));
      };

      /* ---------- режим «заполнить экран» (с обрезкой) / «вписать целиком» ---------- */
      function setFill(on) {
        document.body.classList.toggle("fill", on);
        $("fit").textContent = on ? "⤡" : "⤢";
        $("fit").setAttribute(
          "aria-label",
          on ? "Вписать целиком" : "Заполнить экран",
        );
        try {
          localStorage.setItem("fill", on ? "1" : "0");
        } catch (e) {}
      }
      $("fit").onclick = function () {
        setFill(!document.body.classList.contains("fill"));
      };
      try {
        setFill(localStorage.getItem("fill") === "1");
      } catch (e) {}

      function connect() {
        ws = new WebSocket(wsUrl());
        ws.binaryType = "blob";
        ws.onopen = function () {
          inFallback = false;
          canvas.style.display = "none";
          ws.send(JSON.stringify({ type: "viewer", pin: pin }));
        };
        ws.onclose = function () {
          reset();
          setStatus("Нет связи", "err");
          show(
            "connecting",
            "Переподключение…",
            "Теряется связь с сервером на Mac",
          );
          setTimeout(connect, 1500);
        };
        ws.onmessage = function (ev) {
          if (typeof ev.data !== "string") return drawFrame(ev.data);
          var m = JSON.parse(ev.data);
          if (m.type === "auth") {
            reset();
            pin = "";
            try {
              localStorage.removeItem("pin");
            } catch (e) {}
            setStatus("Нужен PIN", "wait");
            show(
              "auth",
              "Введите PIN",
              m.locked
                ? "Слишком много неверных попыток. Подождите " +
                    Math.ceil((m.wait || 600) / 60) +
                    " мин."
                : m.wrong
                  ? "Неверный PIN, попробуйте ещё раз"
                  : "PIN показан на странице вещания на Mac",
            );
            $("pin").value = "";
            if (!m.wrong)
              setTimeout(function () {
                $("pin").focus();
              }, 50);
          } else if (m.type === "waiting") {
            reset();
            setStatus("Ждём вещание", "wait");
            show(
              "waiting",
              "Ждём вещание с MacBook",
              "На Mac откройте страницу вещания и нажмите «Включить камеру»",
            );
          } else if (m.type === "live") {
            live = true;
            setStatus("Подключаемся…", "wait");
            show("connecting", "Подключаемся к камере…");
            armFallback();
          } else if (m.type === "back-answer") onBackAnswer(m.sdp);
          else if (m.type === "back-ice") onBackIce(m.candidate);
          else if (m.type === "offer") onOffer(m.sdp);
          else if (m.type === "candidate") onCandidate(m.candidate);
        };
      }

      function reset() {
        live = false;
        if (pc) {
          pc.close();
          pc = null;
        }
        clearTimeout(fallbackTimer);
        setFallback(false);
        v.srcObject = null;
        $("sound").hidden = true;
        $("volrow").hidden = true;
        backStop();
        back.mic = back.cam = false;
        refreshBack();
        $("talkrow").hidden = true;
        if (R.rec) stopRec();
        document.body.classList.remove("idle");
      }

      function playing(text) {
        setStatus(text, "live");
        show("playing");
        $("talkrow").hidden = false;
        // «Говорить» и «Моя камера» работают через WebRTC, снимок и запись — всегда
        $("talk").hidden = $("mycam").hidden = inFallback;
        wake();
      }

      function onOffer(sdp) {
        if (pc) pc.close();
        queue = [];
        remote = false;
        var mine = (pc = new RTCPeerConnection(RTC_CONFIG));
        mine.onicecandidate = function (e) {
          if (e.candidate)
            ws.send(
              JSON.stringify({
                type: "viewer-candidate",
                candidate: e.candidate,
              }),
            );
        };
        mine.ontrack = function (e) {
          var s = e.streams && e.streams[0];
          if (!s) {
            s = v.srcObject || new MediaStream();
            s.addTrack(e.track);
          }
          v.srcObject = s;
          playVideo();
          $("sound").hidden = false;
          $("volrow").hidden = !A.canVol;
          applyVolume();
        };
        mine.onconnectionstatechange = function () {
          if (mine !== pc) return;
          if (mine.connectionState === "connected") {
            sendQuality();
            clearTimeout(fallbackTimer);
            setFallback(false);
            playing("В эфире");
          }
        };
        mine
          .setRemoteDescription(sdp)
          .then(function () {
            remote = true;
            queue.forEach(function (c) {
              mine.addIceCandidate(c).catch(function () {});
            });
            queue = [];
            return mine.createAnswer();
          })
          .then(function (a) {
            return mine.setLocalDescription(a);
          })
          .then(function () {
            ws.send(
              JSON.stringify({ type: "answer", sdp: mine.localDescription }),
            );
          })
          .catch(function () {});
      }
      function onCandidate(c) {
        if (!c) return;
        if (pc && remote) pc.addIceCandidate(c).catch(function () {});
        else queue.push(c);
      }

      // Если WebRTC не соединился за 8 с — картинка кадрами JPEG (без звука).
      function armFallback() {
        clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(function () {
          if (live && !(pc && pc.connectionState === "connected"))
            setFallback(true);
        }, 8000);
      }
      function setFallback(on) {
        if (inFallback === on) return;
        inFallback = on;
        canvas.style.display = on ? "block" : "none";
        if (ws && ws.readyState === 1)
          ws.send(JSON.stringify({ type: "want-frames", on: on }));
        if (on) playing("В эфире · без звука");
      }
      function drawFrame(blob) {
        if (!inFallback) return;
        var img = new Image();
        img.onload = function () {
          if (canvas.width !== img.width) {
            canvas.width = img.width;
            canvas.height = img.height;
          }
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(blob);
      }

      show("connecting", "Подключение…");
      connect();
    </script>
  </body>
</html>
