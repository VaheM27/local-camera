name: Build macOS app

# Собирает Local Camera.app в .dmg для Apple Silicon (arm64) и Intel (x64).
# Запуск вручную: вкладка Actions → «Build macOS app» → Run workflow.
# Тег вида v1.0.0 дополнительно публикует файлы в Releases.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/macbook-camera-iphone-safari-qnuce3]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Local-Camera-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
